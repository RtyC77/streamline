project_id = "streamlite"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/recuperar", "http://127.0.0.1:5173/", "http://127.0.0.1:5173/recuperar"]
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.turn-credentials]
# The handler validates the user JWT with Auth and checks room membership via RLS.
# This also works with asymmetric signing keys and new publishable keys.
verify_jwt = false
